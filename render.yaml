# Render Blueprint: one paid web service with persistent private state.
# Import this file from GitHub in Render; no deployment is performed by this file alone.
services:
  - type: web
    name: calendar-digest-actions
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: bash scripts/setup.sh
    startCommand: .venv/bin/python scripts/start_service.py
    healthCheckPath: /health
    disk:
      name: digest-private-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DIGEST_STATE_DIR
        value: /var/data
      # Owner-managed runtime switches. For a NEW service enter false initially.
      # Existing Blueprint syncs must preserve the values chosen in Dashboard.
      - key: DIGEST_SCHEDULE_ENABLED
        sync: false
      # Configure optional Pushover keys in Render, then verify reminders before enabling.
      - key: PUSH_SCHEDULE_ENABLED
        sync: false
      # Optional attendee email reminders for the verified control-calendar account.
      - key: CONTROL_EMAIL_ENABLED
        sync: false
      # Optional read-only iCloud Contacts birthday source; reuses existing iCloud credentials.
      - key: ICLOUD_CONTACT_BIRTHDAYS_ENABLED
        sync: false
      # Render provides RENDER_EXTERNAL_URL; the application uses it as its public URL.
      - key: DIGEST_ACTION_SECRET
        generateValue: true
      - key: DIGEST_WEB_PASSWORD
        generateValue: true
      # Enter these values in Render's protected configuration, never in Git or chat.
      - key: ICLOUD_USERNAME
        sync: false
      - key: ICLOUD_APP_PASSWORD
        sync: false
      - key: MAILRU_1_USERNAME
        sync: false
      - key: MAILRU_1_APP_PASSWORD
        sync: false
      - key: MAILRU_2_USERNAME
        sync: false
      - key: MAILRU_2_APP_PASSWORD
        sync: false
      - key: MAILRU_3_USERNAME
        sync: false
      - key: MAILRU_3_APP_PASSWORD
        sync: false
